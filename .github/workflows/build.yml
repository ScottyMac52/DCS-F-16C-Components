name: Build OvGME package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua parser
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Parse Lua profiles
        shell: pwsh
        run: Get-ChildItem src -Recurse -Filter '*.lua' | ForEach-Object { & luac5.4 -p $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Invalid Lua: $($_.FullName)" } }
      - name: Build package
        shell: pwsh
        run: ./scripts/Build-OvGME.ps1
      - name: Validate package
        shell: pwsh
        run: ./scripts/Test-Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: F-16C-OvGME-package
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish versioned GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = (Get-Content packaging/ovgme/VERSION.TXT -Raw).Trim()
          $Tag = "v$Version"
          if ($env:GITHUB_REF_NAME -ne $Tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION.TXT ($Tag)."
          }
          $Title = "DCS F-16C Components $Version"
          $Assets = Get-ChildItem dist/*.zip, dist/SHA256SUMS.txt | ForEach-Object FullName

          gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $Tag $Assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $Tag --title $Title --notes-file packaging/release/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $Tag $Assets --target $env:GITHUB_SHA --title $Title --notes-file packaging/release/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          }
