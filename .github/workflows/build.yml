name: Build OVGME package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: write is required when commit-kneeboard is true so the
# reusable workflow can push regenerated SVG/PNG back to main.
permissions:
  contents: write

jobs:
  build:
    uses: ScottyMac52/DCS-Common/.github/workflows/build.yml@main
    with:
      package-version: 0.0.0-ci.${{ github.run_number }}
      install-lua-parser: true
      run-lua-parse: true
      run-release-validation: true
      package-script: scripts/Build-OvGME.ps1
      test-package-script: scripts/Test-Package.ps1
      build-release-script: scripts/Build-Release.ps1
      test-release-script: scripts/Test-Package.ps1
      # Keep repo kneeboard assets in lockstep with the OvGME package.
      # Skipped automatically on pull_request; runs on main push / workflow_dispatch.
      commit-kneeboard: true
      kneeboard-paths: kneeboard/source kneeboard/F-16C_50
      artifact-name: F-16C-50-Release
      artifact-path: |
        dist/*.zip
        dist/SHA256SUMS.txt

  report-packaged-kneeboards:
    name: Report packaged kneeboard revision
    needs: build
    if: ${{ always() && needs.build.outputs['generated-commit-url'] != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish generated commit provenance
        env:
          GENERATED_SHA: ${{ needs.build.outputs['generated-commit-sha'] }}
          GENERATED_URL: ${{ needs.build.outputs['generated-commit-url'] }}
          TRIGGER_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo '## Packaged kneeboard revision' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Revision | Commit |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow trigger | [${TRIGGER_SHA:0:7}](https://github.com/$REPOSITORY/commit/$TRIGGER_SHA) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Packaged kneeboards | [${GENERATED_SHA:0:7}]($GENERATED_URL) |" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '> Inspect the **Packaged kneeboards** commit for the generated SVG/PNG files used by this run.' >> "$GITHUB_STEP_SUMMARY"
